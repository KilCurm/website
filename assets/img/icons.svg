<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- ============================================================
       БЕЛЫЕ — используются на красной кнопке / тёмном фоне
       ============================================================ -->

  <!-- Telegram / «Отправить», «Рассчитать стоимость», «Оставить заявку» -->
  <symbol id="icon-send" viewBox="0 0 24 24">
    <path fill="#ffffff" d="M2 21l21-9L2 3v7l15 2-15 2z"/>
  </symbol>

  <!-- Телефон (footer) -->
  <symbol id="icon-phone" viewBox="0 0 24 24">
    <path fill="#ffffff" d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1l-2.3 2.3z"/>
  </symbol>

  <!-- Email (footer) -->
  <symbol id="icon-mail" viewBox="0 0 24 24">
