  </symbol>

  <!-- ============================================================
       КРАСНЫЕ — brand accent (#ed2424)
       ============================================================ -->

  <!-- Качество и надёжность (hero feature #1) -->
  <symbol id="icon-gem" viewBox="0 0 24 24">
    <path fill="#ed2424" d="M6 3h12l4 6-10 13L2 9z"/>
  </symbol>

  <!-- Шестерёнка (hero feature #2, услуга «Изготовление деталей») -->
  <symbol id="icon-cog" viewBox="0 0 24 24">
    <path fill="#ed2424" fill-rule="evenodd" d="M10.5 1h3l.4 2.7a7 7 0 011.8.8l2.2-1.6 2.1 2.1-1.6 2.2a7 7 0 01.8 1.8l2.7.4v3l-2.7.4a7 7 0 01-.8 1.8l1.6 2.2-2.1 2.1-2.2-1.6a7 7 0 01-1.8.8L13.5 23h-3l-.4-2.7a7 7 0 01-1.8-.8l-2.2 1.6-2.1-2.1 1.6-2.2a7 7 0 01-.8-1.8L2 14.5v-3l2.7-.4a7 7 0 01.8-1.8L3.9 7l2.1-2.1L8.2 6.5a7 7 0 011.8-.8L10.5 1zm1.5 7a4 4 0 100 8 4 4 0 000-8z"/>
  </symbol>

  <!-- Быстрые сроки (hero feature #3) -->
  <symbol id="icon-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="#ed2424"/>
    <path fill="#ffffff" d="M11 6h2v6.5l4 2-1 1.7-5-2.7V6z"/>
  </symbol>

  <!-- Восстановление пластиковых деталей -->
  <symbol id="icon-wrench" viewBox="0 0 24 24">
