    <path fill="#ed2424" d="M12 14.5l10-5 0 3-10 5-10-5 0-3 10 5z"/>
    <path fill="#ed2424" d="M12 19.5l10-5 0 3-10 5-10-5 0-3 10 5z"/>
  </symbol>

  <!-- Инженерный подход -->
  <symbol id="icon-target" viewBox="0 0 24 24">
