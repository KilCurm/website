  <!-- Честная коммуникация -->
  <symbol id="icon-message-circle" viewBox="0 0 24 24">
    <path fill="#ed2424" d="M12 2a10 10 0 00-8.6 15l-1.3 4.5 4.6-1.3A10 10 0 1012 2z"/>
  </symbol>

</svg>