  </symbol>

  <!-- Печать по 3D-модели -->
  <symbol id="icon-box" viewBox="0 0 24 24">
    <path fill="#ed2424" d="M12 2l10 5v10l-10 5L2 17V7l10-5zm0 2.2L4.3 8 12 11.9 19.7 8 12 4.2zm-8 5.7v6l7 3.5v-6L4 9.9zm16 0l-7 3.5v6l7-3.5v-6z"/>
